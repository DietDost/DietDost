function art(kind){
 const altText={
  welcome:'Fresh healthy bowl with avocado and vegetables',
  goal:'Modern woman in green activewear representing health goals',
  height:'Mint smart weighing scale and measuring tape',
  weight:'Dumbbells and a green shaker bottle',
  gender:'Friendly male and female wellness avatars',
  birth:'Person watching sunrise over a mountain landscape',
  hunger:'Fresh salad bowl with vegetables and egg',
  meals:'Balanced Indian meal with roti, dal, vegetables and salad'
 };
 const isWelcome=kind==='welcome';
 return `<div class="${isWelcome?'art':'illustration'}"><img class="art-image" src="${artImages[kind]||artImages.welcome}" alt="${altText[kind]||'Healthy lifestyle'}" loading="eager" decoding="async">${isWelcome?'<div class="art-caption">Small steps. Healthier habits.</div>':''}</div>`;
}
function headerProgress(){
 const isOn=!state.onboardingDone;
 $('#stepPill').classList.toggle('hidden',!isOn||state.step===0);
 $('#skipBtn').classList.toggle('hidden',!isOn||state.step!==0);
 $('#progressTrack').classList.toggle('hidden',!isOn||state.step===0);
 $('#progressFill').style.width=(state.step/7*100)+'%';
 $('#stepPill').textContent=`${state.step+1} / 8`;
}
function optionCard(value,sub,emoji,selected,onClick){
 return `<button type="button" class="option ${selected?'selected':''}" data-choice="${escapeHtml(value)}"><span class="emoji-bubble">${emoji}</span><span class="label">${escapeHtml(value)}${sub?`<span class="sub">${escapeHtml(sub)}</span>`:''}</span><span class="check">✓</span></button>`;
}
function selectedUnit(current,value){return current===value?'active':''}
function heightDisplay(){return state.heightUnit==='ft'?`${Math.floor(state.heightCm/30.48)}′${Math.round((state.heightCm/30.48%1)*12)}″`:`${state.heightCm} <small>cm</small>`}
function weightDisplay(){return state.weightUnit==='lbs'?`${(state.weightKg*2.20462).toFixed(1)} <small>lbs</small>`:`${Number(state.weightKg).toFixed(1)} <small>kg</small>`}
function bmi(){const h=state.heightCm/100;return h>0?state.weightKg/(h*h):0}
function renderOnboarding(){
 headerProgress();
 const root=$('#onboarding');root.classList.remove('hidden');$('#mainApp').classList.add('hidden');$('#bottomNav').classList.add('hidden');
 const s=steps[state.step];
 if(state.step===0){
 root.innerHTML=`<section class="screen hero"><div class="hero-copy"><div class="eyebrow">Healthy habits · Real food</div><h1>A Healthier<br><span>You</span> Starts Here</h1><p class="lead">${s.desc}</p><div class="benefits"><div class="benefit"><span class="emoji-bubble">🥑</span>Eat Better</div><div class="benefit"><span class="emoji-bubble">❤️</span>Stay Healthy</div><div class="benefit"><span class="emoji-bubble">🌞</span>Feel Your Best</div></div><button class="primary" id="startBtn">Get Started →</button><p class="footer-note">Your personal nutrition journey starts here.</p></div>${art('welcome')}</section>`;
 $('#startBtn').onclick=()=>go(1);
 return;
 }
 const key=s.key;
 let panel='';
 if(key==='goal'){
 panel=`<div class="options">${goalOptions.map(([v,sub,e])=>optionCard(v,sub,e,state.goal===v)).join('')}</div>`;
 }else if(key==='height'){
 panel=`<div class="unit-toggle"><button data-unit="cm" class="${selectedUnit(state.heightUnit||'cm','cm')}">cm</button><button data-unit="ft" class="${selectedUnit(state.heightUnit||'cm','ft')}">ft / in</button></div><div class="big-value" id="heightValue">${heightDisplay()}</div><div class="ruler-wrap"><input id="heightRange" class="ruler" type="range" min="100" max="230" step="1" value="${state.heightCm}" aria-label="Height in centimetres"><div class="ruler-labels"><span>100 cm</span><span>140</span><span>180</span><span>230 cm</span></div></div><p class="small-note">Slide to change your height. We save height in centimetres.</p>`;
 }else if(key==='weight'){
 const b=bmi();const status=b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obesity';
 const left=Math.max(0,Math.min(100,(b-15)/25*100));
 panel=`<div class="unit-toggle"><button data-unit="kg" class="${selectedUnit(state.weightUnit||'kg','kg')}">kg</button><button data-unit="lbs" class="${selectedUnit(state.weightUnit||'kg','lbs')}">lbs</button></div><div class="big-value" id="weightValue">${weightDisplay()}</div><div class="ruler-wrap"><input id="weightRange" class="ruler" type="range" min="25" max="250" step=".1" value="${state.weightKg}" aria-label="Weight in kilograms"><div class="ruler-labels"><span>25 kg</span><span>75</span><span>150</span><span>250 kg</span></div></div><div class="bmi-card"><div class="bmi-title"><span>Your BMI: ${b.toFixed(1)}</span><span class="bmi-status">${status}</span></div><div class="bmi-bar"><span class="bmi-marker" style="left:${left}%"></span></div><div class="bmi-scale"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div></div><p class="small-note">BMI is a rough screening measure, not a diagnosis.</p>`;
 }else if(key==='gender'){
 panel=`<div class="options">${[['Male','👨🏻'],['Female','👩🏻'],['Other / prefer not to say','🧑🏻']].map(([v,e])=>optionCard(v,'',e,state.gender===v)).join('')}</div>`;
 }else if(key==='birth'){
 const y=Number(state.birthYear)||1998;
 panel=`<div class="year-wheel"><button data-year="${y-2}">${y-2}</button><button data-year="${y-1}">${y-1}</button><button class="current" aria-current="true">${y}</button><button data-year="${y+1}">${y+1}</button><button data-year="${y+2}">${y+2}</button></div><label class="small-note" for="birthSelect">Or select your birth year</label><select id="birthSelect" class="text-input" aria-label="Birth year">${Array.from({length:new Date().getFullYear()-1900+1},(_,i)=>new Date().getFullYear()-i).map(yr=>`<option value="${yr}" ${yr===y?'selected':''}>${yr}</option>`).join('')}</select><p class="small-note">Birth year range: 1900–${new Date().getFullYear()}.</p>`;
 }else if(key==='hunger'){
 panel=`<div class="options">${hungerOptions.map(([v,e])=>optionCard(v,'',e,state.hunger===v)).join('')}</div>`;
 }else if(key==='meals'){
 panel=`<div class="time-fields"><div class="time-field"><label for="breakfastTime">First meal starts at</label><input id="breakfastTime" class="text-input" type="time" value="${escapeHtml(state.breakfast||'08:00')}"></div><div class="time-field"><label for="dinnerTime">Last meal ends at</label><input id="dinnerTime" class="text-input" type="time" value="${escapeHtml(state.dinner||'20:00')}"></div><div class="time-field"><label for="dietSelect">Food preference</label><select id="dietSelect" class="text-input"><option ${state.diet==='Vegetarian'?'selected':''}>Vegetarian</option><option ${state.diet==='Non-vegetarian'?'selected':''}>Non-vegetarian</option><option ${state.diet==='Vegan'?'selected':''}>Vegan</option><option ${state.diet==='Eggetarian'?'selected':''}>Eggetarian</option></select></div></div>`;
 }
 root.innerHTML=`<section class="screen"><div class="question-head"><div class="eyebrow">Step ${state.step+1}/8 · ${key==='goal'?'Your goal':key==='height'||key==='weight'?'Your measurements':key==='gender'||key==='birth'?'Your profile':key==='hunger'?'Your routine':'Your meal plan'}</div><h1 class="question-title">${s.title}</h1><p class="lead">${s.desc}</p></div><div class="question-layout"><div class="panel">${panel}<div class="actions"><button type="button" class="secondary" id="backBtn">← Back</button><button type="button" class="primary" id="nextBtn">${state.step===7?'Finish ✓':'Continue →'}</button></div></div>${art(key==='goal'?'goal':key==='height'?'height':key==='weight'?'weight':key==='gender'?'gender':key==='birth'?'birth':key==='hunger'?'hunger':'meals')}</div></section>`;
 bindStep(key);
}
function bindStep(key){
 $('#backBtn').onclick=()=>go(Math.max(0,state.step-1));
 $('#nextBtn').onclick=()=>{
  if(key==='height'&&(!state.heightCm||state.heightCm<100||state.heightCm>230)){toast('Please choose a valid height.');return}
  if(key==='weight'&&(!state.weightKg||state.weightKg<25||state.weightKg>250)){toast('Please choose a valid weight.');return}
  if(state.step<7)go(state.step+1);else finishSetup();
 };
 $$('.option').forEach(btn=>btn.addEventListener('click',()=>{
  const val=btn.dataset.choice;
  if(key==='goal')state.goal=val;
  if(key==='gender')state.gender=val;
  if(key==='hunger')state.hunger=val;
  save();renderOnboarding();
 }));
 $$('[data-unit]').forEach(btn=>btn.addEventListener('click',()=>{
  if(key==='height')state.heightUnit=btn.dataset.unit;
  if(key==='weight')state.weightUnit=btn.dataset.unit;
  save();renderOnboarding();
 }));
 const hr=$('#heightRange');if(hr)hr.addEventListener('input',e=>{state.heightCm=Number(e.target.value);$('#heightValue').innerHTML=heightDisplay();save()});
 const wr=$('#weightRange');if(wr)wr.addEventListener('input',e=>{state.weightKg=Number(e.target.value);const b=bmi();$('#weightValue').innerHTML=weightDisplay();const status=b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obesity';$('.bmi-title').innerHTML=`<span>Your BMI: ${b.toFixed(1)}</span><span class="bmi-status">${status}</span>`;$('.bmi-marker').style.left=`${Math.max(0,Math.min(100,(b-15)/25*100))}%`;save()});
 $$('[data-year]').forEach(btn=>btn.addEventListener('click',()=>{state.birthYear=Number(btn.dataset.year);save();renderOnboarding()}));
 const ys=$('#birthSelect');if(ys)ys.addEventListener('change',e=>{state.birthYear=Number(e.target.value);save();renderOnboarding()});
 const bt=$('#breakfastTime');if(bt)bt.addEventListener('change',e=>{state.breakfast=e.target.value;save()});
 const dt=$('#dinnerTime');if(dt)dt.addEventListener('change',e=>{state.dinner=e.target.value;save()});
 const ds=$('#dietSelect');if(ds)ds.addEventListener('change',e=>{state.diet=e.target.value;save()});
}
function go(n){state.step=Math.max(0,Math.min(7,n));save();renderOnboarding();window.scrollTo({top:0,behavior:'smooth'})}
function finishSetup(){state.onboardingDone=true;state.step=0;save();renderApp('home');toast('Your DietDost profile is ready!')}
$('#skipBtn').onclick=()=>{state.onboardingDone=true;save();renderApp('home')};
function dailyTargets(){
 const age=Math.max(1,new Date().getFullYear()-Number(state.birthYear||1998));
 const w=Number(state.weightKg)||61,h=Number(state.heightCm)||173;
 let bmr=10*w+6.25*h-5*age+(state.gender==='Male'?5:state.gender==='Female'?-161:-78);
 let factor=state.activity==='Sedentary'?1.2:state.activity==='Lightly active'?1.375:state.activity==='Very active'?1.725:1.55;
 let kcal=Math.round(Math.max(1200,bmr*factor+(state.goal==='Lose weight'?-300:state.goal==='Gain muscle'?250:0)));
 let protein=Math.round(w*(state.goal==='Gain muscle'?1.8:1.6));
 return {age,kcal,protein,carbs:Math.round(kcal*.5/4),fat:Math.round(kcal*.27/9),fiber:Math.round(kcal/1000*14)};
}
const foodCatalog=[
 {name:'Banana',kcal:105,p:1.3,c:27,f:0.4,fi:3.1},{name:'Apple',kcal:95,p:.5,c:25,f:.3,fi:4.4},{name:'Boiled egg',kcal:78,p:6.3,c:.6,f:5.3,fi:0},
 {name:'Oats (50 g)',kcal:190,p:6.5,c:33,f:3.5,fi:5},{name:'Milk (250 ml)',kcal:150,p:8,c:12,f:8,fi:0},{name:'Cooked rice (1 cup)',kcal:205,p:4.3,c:45,f:.4,fi:.6},
 {name:'Roti (1 medium)',kcal:110,p:3.5,c:22,f:1.5,fi:3},{name:'Dal (1 bowl)',kcal:180,p:10,c:28,f:3,fi:8},{name:'Paneer (100 g)',kcal:265,p:18,c:4,f:20,fi:0},
 {name:'Soya chunks (50 g dry)',kcal:173,p:26,c:16,f:.5,fi:6},{name:'Curd (100 g)',kcal:61,p:3.5,c:4.7,f:3.3,fi:0},{name:'Chicken breast (100 g)',kcal:165,p:31,c:0,f:3.6,fi:0},
 {name:'Salad (1 bowl)',kcal:60,p:2,c:12,f:.5,fi:4},{name:'Almonds (15 g)',kcal:87,p:3.2,c:3.2,f:7.5,fi:1.9}
];
function totals(){return state.foods.reduce((a,x)=>{a.kcal+=x.kcal;a.p+=x.p;a.c+=x.c;a.f+=x.f;a.fi+=x.fi;return a},{kcal:0,p:0,c:0,f:0,fi:0})}
function nutrient(label,got,target){const pct=Math.min(100,target?got/target*100:0);return `<div class="nutrient"><div class="nutrient-top"><span>${label}</span><span>${Math.round(got)} / ${target} g</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`}
function renderApp(tab=state.tab||'home'){
 state.tab=tab;save();$('#onboarding').classList.add('hidden');$('#stepPill').classList.add('hidden');$('#skipBtn').classList.add('hidden');$('#progressTrack').classList.add('hidden');$('#mainApp').classList.remove('hidden');$('#bottomNav').classList.remove('hidden');
 $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const target=dailyTargets(),t=totals(),root=$('#mainApp');
 if(tab==='home'){
 root.innerHTML=`<div class="dash-head"><div><div class="eyebrow">Your daily overview</div><h1 class="dash-title">Hello${state.name?' '+escapeHtml(state.name):''} 👋</h1><p class="muted">Small healthy choices add up.</p></div><button class="secondary" id="editProfileBtn">Edit profile</button></div><div class="grid-4"><div class="metric"><span class="metric-label">Calories eaten</span><strong>${Math.round(t.kcal)}</strong><small>of ${target.kcal} kcal</small></div><div class="metric"><span class="metric-label">Protein</span><strong>${Math.round(t.p)} g</strong><small>of ${target.protein} g</small></div><div class="metric"><span class="metric-label">Water</span><strong>${state.water||0} / 8</strong><small>glasses today</small></div><div class="metric"><span class="metric-label">BMI estimate</span><strong>${bmi().toFixed(1)}</strong><small>rough screening only</small></div></div><div class="dash-grid"><section class="card"><h3>Today's nutrition</h3>${nutrient('Protein',t.p,target.protein)}${nutrient('Carbohydrates',t.c,target.carbs)}${nutrient('Fat',t.f,target.fat)}${nutrient('Fiber',t.fi,target.fiber)}<button class="primary full" id="addFoodJump">+ Add food</button></section><section class="card"><h3>Quick actions</h3><div class="options"><button class="option" id="diaryJump"><span class="emoji-bubble">🍽️</span><span class="label">Log your meals<span class="sub">Track food and nutrients</span></span><span>→</span></button><button class="option" id="waterBtn"><span class="emoji-bubble">💧</span><span class="label">Add a glass of water<span class="sub">Build a hydration habit</span></span><span>+</span></button><button class="option" id="reportJump"><span class="emoji-bubble">📊</span><span class="label">View your report<span class="sub">See today's progress</span></span><span>→</span></button></div><p class="footer-note">Nutrition targets are estimates, not medical advice.</p></section></div>`;
 $('#editProfileBtn').onclick=()=>renderApp('profile');$('#addFoodJump').onclick=()=>renderApp('diary');$('#diaryJump').onclick=()=>renderApp('diary');$('#reportJump').onclick=()=>renderApp('reports');$('#waterBtn').onclick=()=>{state.water=Math.min(20,(state.water||0)+1);save();renderApp('home');toast('Water logged 💧')};
 }else if(tab==='diary'){
 root.innerHTML=`<div class="dash-head"><div><div class="eyebrow">Food diary</div><h1 class="dash-title">What did you eat?</h1><p class="muted">Add a food and serving quantity to track your day.</p></div><button class="secondary" id="diaryHome">Home</button></div><div class="dash-grid"><section class="card"><h3>Add food</h3><form id="foodForm" class="food-form"><select id="foodSelect" aria-label="Choose food">${foodCatalog.map((f,i)=>`<option value="${i}">${escapeHtml(f.name)}</option>`).join('')}<option value="-1">Custom food…</option></select><input id="foodQty" type="number" min=".25" max="20" step=".25" value="1" aria-label="Quantity"><button class="primary" type="submit">Add</button></form><p class="small-note">Quantity is in servings. Packaged foods may vary; use label values when available.</p><div id="customFood" class="hidden"><label>Food name<input class="text-input" id="customName" placeholder="e.g. Homemade poha"></label><div class="food-form"><input id="customKcal" type="number" min="0" placeholder="Calories"><input id="customProtein" type="number" min="0" placeholder="Protein g"><input id="customCarbs" type="number" min="0" placeholder="Carbs g"><input id="customFat" type="number" min="0" placeholder="Fat g"></div><button class="primary" id="customAdd" type="button">Add custom food</button></div></section><section class="card"><h3>Today's foods</h3><div class="food-list" id="foodList"></div><div class="bmi-card"><div class="bmi-title"><span>Total calories</span><span>${Math.round(t.kcal)} / ${target.kcal} kcal</span></div><div class="bar"><span style="width:${Math.min(100,t.kcal/target.kcal*100)}%"></span></div></div></section></div>`;
 $('#diaryHome').onclick=()=>renderApp('home');const sel=$('#foodSelect');sel.addEventListener('change',()=>$('#customFood').classList.toggle('hidden',sel.value!=='-1'));
 $('#foodForm').onsubmit=e=>{e.preventDefault();const idx=Number(sel.value);if(idx<0){$('#customFood').classList.remove('hidden');return}const f=foodCatalog[idx],q=Math.max(.25,Number($('#foodQty').value)||1);state.foods.push({id:Date.now(),name:f.name,qty:q,kcal:f.kcal*q,p:f.p*q,c:f.c*q,f:f.f*q,fi:f.fi*q});save();renderApp('diary');toast('Food added to diary')};
 $('#customAdd').onclick=()=>{const name=$('#customName').value.trim();if(!name){toast('Enter a food name');return}const kcal=Number($('#customKcal').value)||0,p=Number($('#customProtein').value)||0,c=Number($('#customCarbs').value)||0,f=Number($('#customFat').value)||0;state.foods.push({id:Date.now(),name,qty:1,kcal,p,c,f,fi:0});save();renderApp('diary');toast('Custom food added')};
 const list=$('#foodList');if(!state.foods.length)list.innerHTML='<div class="empty">No food logged yet. Add your first meal above.</div>';else list.innerHTML=state.foods.map(x=>`<div class="food-row"><span class="emoji-bubble">🍽️</span><span class="food-name">${escapeHtml(x.name)}<small>${x.qty||1} serving · ${Math.round(x.kcal)} kcal</small></span><button class="icon-btn" data-remove="${x.id}" aria-label="Remove ${escapeHtml(x.name)}">×</button></div>`).join('');
 $$('[data-remove]').forEach(b=>b.onclick=()=>{state.foods=state.foods.filter(x=>x.id!==Number(b.dataset.remove));save();renderApp('diary')});
 }else if(tab==='reports'){
 root.innerHTML=`<div><div class="eyebrow">Your progress</div><h1 class="dash-title">Nutrition report</h1><p class="muted">A simple view of today's logged nutrition.</p></div><div class="grid-4"><div class="metric"><span class="metric-label">Calories</span><strong>${Math.round(t.kcal)}</strong><small>Target ${target.kcal} kcal</small></div><div class="metric"><span class="metric-label">Protein</span><strong>${Math.round(t.p)} g</strong><small>Target ${target.protein} g</small></div><div class="metric"><span class="metric-label">Carbs</span><strong>${Math.round(t.c)} g</strong><small>Target ${target.carbs} g</small></div><div class="metric"><span class="metric-label">Fiber</span><strong>${Math.round(t.fi)} g</strong><small>Target ${target.fiber} g</small></div></div><section class="card"><h3>Daily targets</h3>${nutrient('Calories',t.kcal,target.kcal)}${nutrient('Protein',t.p,target.protein)}${nutrient('Carbohydrates',t.c,target.carbs)}${nutrient('Fat',t.f,target.fat)}${nutrient('Fiber',t.fi,target.fiber)}<p class="footer-note">This report reflects foods logged in this browser. It is not a clinical assessment.</p></section>`;
 }else if(tab==='profile'){
 root.innerHTML=`<div><div class="eyebrow">Your preferences</div><h1 class="dash-title">Profile & settings</h1><p class="muted">Edit your details any time; saved locally in this browser.</p></div><section class="card"><h3>Personal details</h3><div class="profile-row"><div class="time-field"><label for="profileName">Name (optional)</label><input id="profileName" class="text-input" value="${escapeHtml(state.name||'')}" placeholder="Your name"></div><div class="time-field"><label for="profileGoal">Main goal</label><select id="profileGoal" class="text-input">${goalOptions.map(x=>`<option ${state.goal===x[0]?'selected':''}>${x[0]}</option>`).join('')}</select></div><div class="time-field"><label for="profileGender">Gender</label><select id="profileGender" class="text-input"><option value="">Prefer not to say</option>${['Male','Female','Other / prefer not to say'].map(x=>`<option ${state.gender===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="time-field"><label for="profileBirth">Birth year</label><select id="profileBirth" class="text-input">${Array.from({length:new Date().getFullYear()-1900+1},(_,i)=>new Date().getFullYear()-i).map(y=>`<option value="${y}" ${y===Number(state.birthYear)?'selected':''}>${y}</option>`).join('')}</select></div><div class="time-field"><label for="profileHeight">Height (cm)</label><input id="profileHeight" class="text-input" type="number" min="100" max="230" value="${state.heightCm}"></div><div class="time-field"><label for="profileWeight">Weight (kg)</label><input id="profileWeight" class="text-input" type="number" min="25" max="250" step=".1" value="${state.weightKg}"></div><div class="time-field"><label for="profileActivity">Activity level</label><select id="profileActivity" class="text-input">${['Sedentary','Lightly active','Moderately active','Very active'].map(x=>`<option ${state.activity===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="time-field"><label for="profileDiet">Food preference</label><select id="profileDiet" class="text-input">${['Vegetarian','Non-vegetarian','Vegan','Eggetarian'].map(x=>`<option ${state.diet===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="actions"><button class="secondary" id="restartSetup">Restart onboarding</button><button class="primary" id="saveProfile">Save changes</button></div></section><section class="card"><h3>Data & privacy</h3><p class="footer-note">Your profile and food diary are stored locally in this browser. This demo does not create an online account or sync data between devices.</p><button class="secondary" id="exportData">Export my data (JSON)</button></section>`;
 $('#saveProfile').onclick=()=>{state.name=$('#profileName').value.trim();state.goal=$('#profileGoal').value;state.gender=$('#profileGender').value;state.birthYear=Number($('#profileBirth').value);state.heightCm=Math.max(100,Math.min(230,Number($('#profileHeight').value)||173));state.weightKg=Math.max(25,Math.min(250,Number($('#profileWeight').value)||61));state.activity=$('#profileActivity').value;state.diet=$('#profileDiet').value;save();renderApp('profile');toast('Profile saved')};
 $('#restartSetup').onclick=()=>{state.onboardingDone=false;state.step=0;save();renderOnboarding()};
 $('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='dietdost-data.json';a.click();URL.revokeObjectURL(url)};
 }
 $$('.nav-btn').forEach(b=>b.onclick=()=>renderApp(b.dataset.tab));
 window.scrollTo({top:0,behavior:'smooth'});
}
if(state.onboardingDone)renderApp(state.tab||'home');else renderOnboarding();
})();
</script>
</body>
</html>
